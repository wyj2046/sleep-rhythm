<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>晨昏记</title>
    <link rel="stylesheet" href="./styles.css?v=20261004-recent-review" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./trend-core.js?v=20261004-recent-review" defer></script>
    <script src="./entry-details.js?v=20261004-recent-review" defer></script>
    <script src="./app.js?v=20261004-recent-review" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Dawn & Dusk</p>
          <h1>晨昏记</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="exportCsvBtn" type="button" title="导出 CSV" aria-label="导出 CSV">
            <i data-lucide="file-spreadsheet"></i>
          </button>
          <button class="icon-button" id="exportJsonBtn" type="button" title="导出 JSON" aria-label="导出 JSON">
            <i data-lucide="download"></i>
          </button>
          <label class="icon-button file-button" title="导入 JSON" aria-label="导入 JSON">
            <i data-lucide="upload"></i>
            <input id="importJsonInput" type="file" accept="application/json" />
          </label>
        </div>
      </header>

      <nav class="mobile-section-nav" aria-label="主要区域">
        <a href="#trendWorkspace">
          <i data-lucide="chart-no-axes-combined"></i>
          趋势
        </a>
        <a href="#entryForm">
          <i data-lucide="notebook-pen"></i>
          记录
        </a>
      </nav>

      <main class="layout">
        <section class="workspace" id="trendWorkspace">
          <section class="recap-panel" aria-labelledby="trendTitle">
            <div class="recap-topline">
              <p class="eyebrow">日有所记，夜有所安</p>
              <div class="period-switch" role="group" aria-label="摘要时间范围">
                <button type="button" data-summary-days="7" aria-pressed="false">近 7 天</button>
                <button type="button" data-summary-days="28" aria-pressed="true">近 28 天</button>
              </div>
            </div>
            <h2 id="trendTitle" class="recap-title">从今天开始，认识自己的节律</h2>
            <p class="recap-description" id="summaryText"></p>
            <div class="stats-grid" id="statsGrid"></div>
            <div class="freshness-row">
              <div><p id="dataFreshness"></p><p id="recordCoverage" class="field-hint"></p></div>
              <div class="freshness-actions"><button type="button" class="text-button" id="checkSyncBtn">刷新核对</button><a class="record-link" href="#entryForm">记录今天 <i data-lucide="arrow-up-right"></i></a></div>
            </div>
          </section>
          <section class="chart-panel trend-workspace" aria-labelledby="chartTitle">
            <header class="trend-heading">
              <div>
                <div class="trend-context">
                  <span class="range-pill">全部日期</span>
                  <span id="rangeLabel"></span>
                </div>
                <h2 class="trend-insight" id="chartTitle">节律轨迹</h2>
              </div>
              <div class="trend-actions">
                <label class="median-toggle" for="medianToggle">
                  <span>7日中位数</span>
                  <input id="medianToggle" type="checkbox" checked />
                  <span class="toggle-track" aria-hidden="true"><span></span></span>
                </label>
                <span class="trend-source" id="trendSourceStatus" data-status="checking">
                  <i data-lucide="cloud"></i>
                  正在读取数据
                </span>
              </div>
            </header>

            <section class="history-overview" aria-labelledby="overviewTitle">
              <div class="overview-heading">
                <h3 id="overviewTitle">全部日期趋势概览</h3>
                <div class="legend" aria-label="图例">
                  <span><b class="dot sleep-dot"></b>就寝</span>
                  <span><b class="dot wake-dot"></b>起床</span>
                  <span><b class="dot alert-dot"></b>偏离</span>
                </div>
              </div>
              <svg id="trendChart" role="img" aria-labelledby="chartTitle trendDescription"></svg>
              <p class="sr-only" id="trendDescription"></p>
            </section>

            <div class="month-toolbar"><nav class="month-jump" id="monthJump" aria-label="按月份查看"></nav><button class="text-button" id="historyToggle" type="button" aria-expanded="false">展开全部月份</button></div>

            <div class="trend-content">
              <div class="month-list" id="monthCharts"></div>
              <aside class="night-detail" id="dayDetail" aria-live="polite"></aside>
            </div>

            <p class="chart-caveat">就寝与起床之间为记录时段，未扣除清醒时间。时间规则仅检查晚于目标及记录时段不足 6 小时，不代表睡眠质量。</p>
          </section>

          <section class="content-grid">
            <div class="panel">
              <div class="panel-heading">
                <h2>近期需要留意</h2>
              </div>
              <div id="anomalyList" class="anomaly-list"></div>
            </div>

            <div class="panel">
              <div class="panel-heading">
                <h2>记录簿</h2>
                <button class="text-button danger" id="clearAllBtn" type="button">清空</button>
              </div>
              <label class="ledger-search"><span class="sr-only">搜索记录</span><input type="search" id="entrySearch" placeholder="搜索日期、备注或标签" /></label>
              <div id="entryList" class="entry-list"></div>
            </div>
          </section>
        </section>

        <aside class="side-panel" id="recordWorkspace">
          <section class="panel">
            <div class="panel-heading">
              <h2>记录</h2>
              <button class="text-button ghost" id="resetFormBtn" type="button">新建</button>
            </div>
            <form id="entryForm" class="entry-form">
              <input id="editingId" type="hidden" />
              <label>
                <span>记录日期</span>
                <input id="sleepDate" name="sleepDate" type="date" aria-describedby="dateHint" required />
                <small class="field-hint" id="dateHint">建议按起床日记录，例如昨晚至今早记为今天。</small>
              </label>
              <div class="field-grid">
                <label>
                  <span>就寝时间</span>
                  <input id="bedTime" name="bedTime" type="time" required />
                </label>
                <label>
                  <span>起床（离床）</span>
                  <input id="wakeTime" name="wakeTime" type="time" required />
                </label>
              </div>
              <label>
                <span>就寝时间的含义</span>
                <select id="bedTimeKind" name="bedTimeKind">
                  <option value="bed">上床准备休息</option>
                  <option value="asleep">估计睡着</option>
                  <option value="unspecified">历史记录 · 尚未确认</option>
                </select>
              </label>
              <details class="sleep-details" id="sleepDetails">
                <summary>补充睡眠情况 <span>选填</span></summary>
                <p class="field-hint">记得多少填多少。不确定的时间可以留空。</p>
                <div class="field-grid">
                  <label><span>估计睡着</span><input id="sleepOnsetTime" type="time" /></label>
                  <label><span>最终醒来</span><input id="finalWakeTime" type="time" /></label>
                </div>
                <label><span>夜间清醒合计（分钟）</span><input id="awakeMinutes" type="number" min="0" max="1440" step="1" placeholder="不确定可留空" /></label>
                <label><span>晨起感受</span><select id="morningFeeling"><option value="">未记录</option><option value="rested">精神不错</option><option value="neutral">一般</option><option value="tired">仍然疲惫</option></select></label>
              </details>
              <p class="form-message" id="entryMessage" role="status" aria-live="polite" hidden></p>
              <fieldset class="tag-fieldset">
                <legend>影响因素</legend>
                <div class="tag-grid" id="tagGrid"></div>
              </fieldset>
              <label>
                <span>备注</span>
                <textarea id="note" name="note" rows="4" placeholder="那天发生了什么"></textarea>
              </label>
              <button class="primary-button" type="submit">
                <i data-lucide="save"></i>
                保存记录
              </button>
            </form>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>目标</h2>
            </div>
            <form id="settingsForm" class="settings-form">
              <div class="field-grid">
                <label>
                  <span>目标就寝</span>
                  <input id="targetBed" name="targetBed" type="time" />
                </label>
                <label>
                  <span>目标起床</span>
                  <input id="targetWake" name="targetWake" type="time" />
                </label>
              </div>
              <label>
                <span>晚于目标的阈值 <b id="driftValue"></b></span>
                <input id="driftThreshold" name="driftThreshold" type="range" min="15" max="120" step="15" />
              </label>
              <p class="target-effective-status" id="targetEffectiveStatus"></p>
              <button class="text-button target-save-button" type="submit">
                <i data-lucide="calendar-check"></i>
                从今天起使用
              </button>
              <details class="target-history">
                <summary>查看目标历史</summary>
                <div class="target-history-list" id="targetHistoryList"></div>
              </details>
            </form>
          </section>

          <section class="panel">
            <div class="panel-heading">
              <h2>云同步</h2>
              <span class="status-badge" id="cloudBadge">本地</span>
            </div>
            <p class="sync-status" id="cloudStatus">正在检查云同步配置...</p>
            <div class="sync-actions">
              <div class="google-button-host" id="googleButtonHost" hidden></div>
              <button class="text-button" id="signInBtn" type="button" hidden>
                <i data-lucide="log-in"></i>
                Google 登录
              </button>
              <button class="text-button" id="syncNowBtn" type="button" hidden>
                <i data-lucide="refresh-cw"></i>
                同步
              </button>
              <button class="text-button ghost" id="signOutBtn" type="button" hidden>退出</button>
            </div>
          </section>
        </aside>
      </main>
    </div>
  </body>
</html>
